<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>운동 기록</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/Pretendard-Black.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>
  <div id="dock">
    <div id="timer" hidden role="timer">
      <span id="tbar" aria-hidden="true"></span>
      <span class="t-label">휴식</span><b id="tleft"></b>
      <button data-act="t30">+30초</button><button data-act="tskip">건너뛰기</button>
    </div>
    <button id="next" data-act="done" hidden></button>
  </div>
  <nav aria-label="주요 메뉴">
    <button data-tab="workout"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>운동</span></button>
    <button data-tab="diet"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0ZM8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg><span>식단</span></button>
    <button data-tab="history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>기록</span></button>
    <button data-tab="manage"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>관리</span></button>
  </nav>
  <dialog id="dlg"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
